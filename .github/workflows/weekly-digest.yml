# Weekly sprint digest posted to Slack on Sunday evenings.
# Thin caller for the weekly-digest reusable module. Requires SLACK_WEBHOOK_URL on this repo.
# The guard job skips the call when the webhook is absent, so it doesn't fail startup.
# NOTE: schedule triggers only fire from the default branch (develop).
name: Weekly Sprint Digest

on:
  schedule:
    - cron: "0 18 * * 0" # Sundays, 18:00 UTC
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      has_webhook: ${{ steps.check.outputs.has_webhook }}
    steps:
      - id: check
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            echo "has_webhook=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_webhook=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SLACK_WEBHOOK_URL not set — skipping weekly digest."
          fi

  digest:
    needs: guard
    if: ${{ needs.guard.outputs.has_webhook == 'true' }}
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: suyash21101/.github/.github/workflows/weekly-digest.yml@v1.1.1
    secrets: inherit
