# Modular pipeline orchestrator (see docs/PIPELINE_PLAYBOOK.md §17 + docs/BUILD_ROADMAP.md).
#
# Stages are toggled at runtime via the `PIPELINE_CONFIG` GitHub Actions variable
# (org default + optional repo override). Until that variable is set, this falls back to the
# committed `pipeline.config.default.json`, so the pipeline works out of the box.
#
# Each stage delegates to a reusable module in suyash21101/.github, pinned to @v1.3.0.
# Stage bodies live there; this file only orchestrates (resolve config, detect changes, gate).
#
# Gated vs advisory (PIPELINE_PLAYBOOK §17.3):
#   - Gated stages are listed in `gate.needs`; a failure there fails the one required check.
#   - Advisory stages (pr_review, regression, bundle_size) run and comment but are NOT in
#     `gate.needs`, so they never block a merge.
#
# Branch protection should require ONLY the `gate` job — disabled stages skip, and `gate`
# treats skipped jobs as pass, so turning a stage off never blocks a merge.

name: Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [develop, master]

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      cfg: ${{ steps.resolve.outputs.cfg }}
      has_anthropic: ${{ steps.detect.outputs.has_anthropic }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        name: Resolve PIPELINE_CONFIG (variable, else default file)
        run: |
          CONFIG='${{ vars.PIPELINE_CONFIG }}'
          if [ -z "$CONFIG" ]; then
            echo "PIPELINE_CONFIG variable not set — falling back to pipeline.config.default.json"
            CONFIG=$(cat pipeline.config.default.json)
          fi
          # Validate it is parseable JSON, then emit compact form for downstream `if:` gates.
          echo "$CONFIG" | jq -e . > /dev/null
          echo "cfg=$(echo "$CONFIG" | jq -c .)" >> "$GITHUB_OUTPUT"
      - id: detect
        name: Detect whether Claude auth (API key or subscription token) is configured
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          # has_anthropic=true when EITHER a billed API key OR a Claude subscription token is set.
          if [ -n "$ANTHROPIC_API_KEY" ] || [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "has_anthropic=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_anthropic=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Claude auth (ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN) — skipping Claude stages."
          fi
      - name: Record resolved config in run summary
        run: |
          {
            echo "### Pipeline config for this run";
            echo '```json';
            echo '${{ steps.resolve.outputs.cfg }}' | jq .;
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"

  # Detect whether migration/schema files changed, so migration-safety only runs when relevant.
  # paths-filter reads the PR file list via the API; under a restricted default workflow token
  # (org repos commonly) the job must request pull-requests:read or it fails
  # "Resource not accessible by integration".
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            migrations:
              - 'sql/**'
              - '**/migrations/**'

  # ---- Gated stages (listed in gate.needs) ----

  lint:
    needs: config
    if: ${{ fromJSON(needs.config.outputs.cfg).stages.lint.enabled }}
    uses: suyash21101/.github/.github/workflows/lint.yml@v1.3.0

  typecheck:
    needs: config
    if: ${{ fromJSON(needs.config.outputs.cfg).stages.typecheck.enabled }}
    uses: suyash21101/.github/.github/workflows/typecheck.yml@v1.3.0

  test:
    needs: config
    if: ${{ fromJSON(needs.config.outputs.cfg).stages.test.enabled }}
    uses: suyash21101/.github/.github/workflows/test.yml@v1.3.0
    with:
      coverage_min: ${{ fromJSON(needs.config.outputs.cfg).stages.test.coverage_min }}

  build:
    needs: config
    if: ${{ fromJSON(needs.config.outputs.cfg).stages.build.enabled }}
    uses: suyash21101/.github/.github/workflows/build.yml@v1.3.0

  prisma_validate:
    needs: config
    if: ${{ fromJSON(needs.config.outputs.cfg).stages.prisma_validate.enabled }}
    uses: suyash21101/.github/.github/workflows/prisma-validate.yml@v1.3.0

  # Claude stages request pull-requests:write to comment. The repo's default workflow token is
  # read-only, and a called reusable workflow cannot escalate beyond the caller job's token —
  # so each Claude job must grant the write scope here, or the run fails at startup.
  security_scan:
    needs: config
    if: ${{ fromJSON(needs.config.outputs.cfg).stages.security_scan.enabled && needs.config.outputs.has_anthropic == 'true' }}
    permissions:
      contents: read
      pull-requests: write
      issues: read
    uses: suyash21101/.github/.github/workflows/claude-security-scan.yml@v1.3.0
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  migration_safety:
    needs: [config, changes]
    if: ${{ fromJSON(needs.config.outputs.cfg).stages.migration_safety.enabled && needs.changes.outputs.migrations == 'true' && needs.config.outputs.has_anthropic == 'true' }}
    permissions:
      contents: read
      pull-requests: write
      issues: read
    uses: suyash21101/.github/.github/workflows/claude-migration-safety.yml@v1.3.0
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  # ---- Advisory stages (NOT in gate.needs — they comment but never block) ----

  bundle_size:
    needs: config
    if: ${{ fromJSON(needs.config.outputs.cfg).stages.bundle_size.enabled }}
    uses: suyash21101/.github/.github/workflows/bundle-size.yml@v1.3.0
    with:
      threshold_kb: ${{ fromJSON(needs.config.outputs.cfg).stages.bundle_size.threshold_kb }}

  pr_review:
    needs: config
    if: ${{ fromJSON(needs.config.outputs.cfg).stages.pr_review.enabled && needs.config.outputs.has_anthropic == 'true' }}
    permissions:
      contents: read
      pull-requests: write
      issues: read
    uses: suyash21101/.github/.github/workflows/claude-pr-review.yml@v1.3.0
    with:
      model: ${{ fromJSON(needs.config.outputs.cfg).stages.pr_review.model }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  regression:
    needs: config
    if: ${{ fromJSON(needs.config.outputs.cfg).stages.regression.enabled && needs.config.outputs.has_anthropic == 'true' }}
    permissions:
      contents: read
      pull-requests: write
      issues: read
    uses: suyash21101/.github/.github/workflows/claude-regression-check.yml@v1.3.0
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  # The ONLY required status check. Passes unless a GATED stage that actually ran failed.
  # Advisory stages are deliberately excluded from `needs` so they cannot block a merge.
  gate:
    needs:
      - config
      - changes
      - lint
      - typecheck
      - test
      - build
      - prisma_validate
      - security_scan
      - migration_safety
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any executed stage failed
        run: |
          echo '${{ toJSON(needs) }}' | jq -e '
            to_entries | map(select(.value.result == "failure")) | length == 0
          ' > /dev/null || { echo "::error::A required pipeline stage failed"; exit 1; }
          echo "All enabled stages passed (skipped stages are intentionally disabled)."
