# Modular pipeline orchestrator (see docs/PIPELINE_PLAYBOOK.md §17 + docs/BUILD_ROADMAP.md).
#
# Stages are toggled at runtime via the `PIPELINE_CONFIG` GitHub Actions variable
# (org default + optional repo override). Until that variable is set, this falls back to the
# committed `pipeline.config.default.json`, so the pipeline works out of the box.
#
# Phase 2: each stage delegates to a reusable module in suyash21101/.github, pinned to @v1.
# Stage bodies live there; this file only orchestrates (resolve config, gate on results).
#
# Branch protection should require ONLY the `gate` job — disabled stages skip, and `gate`
# treats skipped jobs as pass, so turning a stage off never blocks a merge.

name: Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [develop, staging, main]

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      cfg: ${{ steps.resolve.outputs.cfg }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        name: Resolve PIPELINE_CONFIG (variable, else default file)
        run: |
          CONFIG='${{ vars.PIPELINE_CONFIG }}'
          if [ -z "$CONFIG" ]; then
            echo "PIPELINE_CONFIG variable not set — falling back to pipeline.config.default.json"
            CONFIG=$(cat pipeline.config.default.json)
          fi
          # Validate it is parseable JSON, then emit compact form for downstream `if:` gates.
          echo "$CONFIG" | jq -e . > /dev/null
          echo "cfg=$(echo "$CONFIG" | jq -c .)" >> "$GITHUB_OUTPUT"
      - name: Record resolved config in run summary
        run: |
          {
            echo "### Pipeline config for this run";
            echo '```json';
            echo '${{ steps.resolve.outputs.cfg }}' | jq .;
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    needs: config
    if: ${{ fromJSON(needs.config.outputs.cfg).stages.lint.enabled }}
    uses: suyash21101/.github/.github/workflows/lint.yml@v1

  typecheck:
    needs: config
    if: ${{ fromJSON(needs.config.outputs.cfg).stages.typecheck.enabled }}
    uses: suyash21101/.github/.github/workflows/typecheck.yml@v1

  test:
    needs: config
    if: ${{ fromJSON(needs.config.outputs.cfg).stages.test.enabled }}
    uses: suyash21101/.github/.github/workflows/test.yml@v1
    with:
      coverage_min: ${{ fromJSON(needs.config.outputs.cfg).stages.test.coverage_min }}

  build:
    needs: config
    if: ${{ fromJSON(needs.config.outputs.cfg).stages.build.enabled }}
    uses: suyash21101/.github/.github/workflows/build.yml@v1

  # The ONLY required status check. Passes unless a stage that actually ran reported failure.
  gate:
    needs: [config, lint, typecheck, test, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any executed stage failed
        run: |
          echo '${{ toJSON(needs) }}' | jq -e '
            to_entries | map(select(.value.result == "failure")) | length == 0
          ' > /dev/null || { echo "::error::A required pipeline stage failed"; exit 1; }
          echo "All enabled stages passed (skipped stages are intentionally disabled)."
