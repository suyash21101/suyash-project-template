# Post-deploy HTTP sanity checks. Fires after a successful production deployment (the AWS
# deploy workflow creates a GitHub Deployment) or manually with an explicit target URL.
# Thin caller for the claude-sanity-check reusable module.
name: Post-Deploy Sanity Check

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL to run sanity checks against"
        required: true
        type: string

jobs:
  resolve:
    runs-on: ubuntu-latest
    # Run on manual dispatch, or only on a successful production deployment.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'production')
    outputs:
      target: ${{ steps.url.outputs.target }}
    steps:
      - id: url
        name: Resolve target URL
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "target=${{ inputs.target_url }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.deployment_status.target_url }}" ]; then
            echo "target=${{ github.event.deployment_status.target_url }}" >> "$GITHUB_OUTPUT"
          else
            echo "target=${{ vars.PRODUCTION_URL }}" >> "$GITHUB_OUTPUT"
          fi

  sanity:
    needs: resolve
    uses: suyash21101/.github/.github/workflows/claude-sanity-check.yml@v1.1.0
    with:
      target_url: ${{ needs.resolve.outputs.target }}
