# Weekly dependency audit (npm audit + outdated; opens an issue on vulnerabilities).
# Thin caller for the dependency-audit reusable module.
# NOTE: schedule triggers only fire from the default branch (main).
name: Dependency Audit

on:
  schedule:
    - cron: "0 0 * * 0" # Sundays, 00:00 UTC
  workflow_dispatch:

jobs:
  audit:
    permissions:
      contents: read
      issues: write
    uses: suyash21101/.github/.github/workflows/dependency-audit.yml@v1.1.1
